[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certify-reverse"
version = "0.5.4"
description = "Caddy reverse proxy bootstrapper with DNS plugin automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.16.0",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
    "types-pyyaml>=6.0.12.20250516",
]

[project.scripts]
certify-reverse = "certify_reverse.cli:entrypoint"
certify-reverse-status = "certify_reverse.status_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certify_reverse = ["static/favicon.ico"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
