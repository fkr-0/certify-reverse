[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certify-reverse"
version = "0.5.1"
description = "Caddy reverse proxy bootstrapper with DNS plugin automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
certify-reverse = "certify_reverse.cli:entrypoint"
certify-reverse-status = "certify_reverse.status_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certify_reverse = ["static/favicon.ico"]
